# Processed by the nginx image's envsubst at startup: ${PORT} is filled from the
# environment (default 8080, see Dockerfile). Only ${PORT} is substituted —
# nginx's own $uri is left untouched.
server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Public product page: it SHOULD be indexed, so no X-Robots-Tag here.

    # Single-page site: serve index.html, fall back to the custom 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The custom 404 with the lost creature
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Liveness/readiness probe for the cluster
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # App downloads: short cache so a rebuilt zip goes out quickly
    location ~* \.zip$ {
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
